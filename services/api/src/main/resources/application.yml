spring:
  application:
    name: payagent-api
  datasource:
    url: ${PAYAGENT_DB_URL:jdbc:postgresql://postgres:5432/payagent}
    username: ${PAYAGENT_DB_USER:payagent}
    password: ${PAYAGENT_DB_PASSWORD:payagent}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${PORT:${PAYAGENT_API_PORT:8080}}

payagent:
  jwt:
    secret: ${PAYAGENT_JWT_SECRET:}
  paypal:
    base-url: ${PAYPAL_API_BASE_URL:https://api-m.sandbox.paypal.com}
    client-id: ${PAYPAL_CLIENT_ID:}
    client-secret: ${PAYPAL_CLIENT_SECRET:}
    webhook-id: ${PAYPAL_WEBHOOK_ID:}
  evidence:
    storage-path: ${PAYAGENT_EVIDENCE_STORAGE_PATH:/var/payagent/evidence}
    signing-secret: ${PAYAGENT_EVIDENCE_SIGNING_SECRET:}
  spring-ai:
    api-key: ${SPRING_AI_OPENAI_API_KEY:}
    base-url: ${SPRING_AI_OPENAI_BASE_URL:}
    model: ${SPRING_AI_OPENAI_MODEL:gpt-4o-mini}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${PAYAGENT_DB_URL:jdbc:postgresql://localhost:5432/payagent}
