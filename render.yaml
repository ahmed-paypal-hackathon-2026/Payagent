# Render blueprint (Member E) — adjust before production deploy.
services:
  - type: web
    name: payagent-api
    runtime: docker
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: PAYAGENT_DB_URL
        fromDatabase:
          name: payagent-db
          property: connectionString
      - key: PAYAGENT_DB_USER
        fromDatabase:
          name: payagent-db
          property: user
      - key: PAYAGENT_DB_PASSWORD
        fromDatabase:
          name: payagent-db
          property: password
      - key: PAYAGENT_JWT_SECRET
        generateValue: true
      - key: PAYPAL_API_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://payagent-web-89qf.onrender.com
      - key: PAYAGENT_EVIDENCE_STORAGE_PATH
        value: /var/payagent/evidence
      - key: PAYAGENT_EVIDENCE_SIGNING_SECRET
        sync: false

  - type: web
    name: payagent-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: payagent-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_USE_MOCKS
        value: "false"
      - key: API_BASE_URL
        fromService:
          type: web
          name: payagent-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: USE_MOCKS
        value: "false"

databases:
  - name: payagent-db
    plan: basic-256mb
    databaseName: payagent
    user: payagent
