services:
  postgres:
    image: postgres:16.4-alpine
    container_name: payagent-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payagent}
      POSTGRES_USER: ${POSTGRES_USER:-payagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    volumes:
      - payagent_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-payagent} -d ${POSTGRES_DB:-payagent}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: payagent-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PAYAGENT_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-payagent}
      PAYAGENT_DB_USER: ${POSTGRES_USER:-payagent}
      PAYAGENT_DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
      PAYAGENT_JWT_SECRET: ${PAYAGENT_JWT_SECRET:-local-dev-only-change-before-shared-demo}
      PAYPAL_API_BASE_URL: ${PAYPAL_API_BASE_URL:-https://api-m.sandbox.paypal.com}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      SPRING_AI_OPENAI_API_KEY: ${SPRING_AI_OPENAI_API_KEY:-}
      SPRING_AI_OPENAI_BASE_URL: ${SPRING_AI_OPENAI_BASE_URL:-}
      SPRING_AI_OPENAI_MODEL: ${SPRING_AI_OPENAI_MODEL:-gpt-4o-mini}
      PAYAGENT_EVIDENCE_STORAGE_PATH: /var/payagent/evidence
      PAYAGENT_EVIDENCE_SIGNING_SECRET: ${PAYAGENT_EVIDENCE_SIGNING_SECRET:-local-evidence-signing-secret}
    ports:
      - "${PAYAGENT_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
        NEXT_PUBLIC_USE_MOCKS: ${NEXT_PUBLIC_USE_MOCKS:-true}
    container_name: payagent-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
      NEXT_PUBLIC_USE_MOCKS: ${NEXT_PUBLIC_USE_MOCKS:-true}
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  payagent_pg_data:
